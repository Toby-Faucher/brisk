[package]
name = "brisk-client"
edition.workspace = true
version.workspace = true

[dependencies]
brisk-proto = { path = "../brisk-proto" }
bytes = "1"
libc = "0.2"
rand_core = { version = "0.6.4", features = ["getrandom"] }
rsa = { version = "0.9.10", features = ["sha2"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = "=0.0.2-alpha"
sha2 = "0.10.9"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "macros", "signal", "sync"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
x509-cert = { version = "0.2.5", features = ["pem", "builder"] }

[dev-dependencies]
aes = "0.8.4"
aes-gcm = "0.10.3"
# Independent ENet 1.3 implementation (pure Rust) for the fake Sunshine control server in tests.
rusty_enet = "=0.4.0"
tempfile = "3"

[lints]
workspace = true
