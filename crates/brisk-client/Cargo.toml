[package]
name = "brisk-client"
edition.workspace = true
version.workspace = true
publish = false

[dependencies]
brisk-proto.workspace = true
bytes.workspace = true
libc = "0.2"
rand_core.workspace = true
rsa.workspace = true
rustls = { workspace = true, features = ["tls12"] }
rustls-rustcrypto.workspace = true
sha2.workspace = true
socket2 = { version = "0.6", features = ["all"] }
tokio = { workspace = true, features = ["rt", "net", "io-util", "time", "macros", "signal", "sync"] }
tracing.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
x509-cert = { workspace = true, features = ["builder"] }

[dev-dependencies]
proptest.workspace = true
aes.workspace = true
aes-gcm.workspace = true
# Independent ENet 1.3 implementation (pure Rust) for the fake Sunshine control server in tests.
rusty_enet = "=0.4.0"
tempfile.workspace = true

[lints]
workspace = true
