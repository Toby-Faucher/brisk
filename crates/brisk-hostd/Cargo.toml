[package]
name = "brisk-hostd"
edition.workspace = true
version.workspace = true
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http-body-util = "0.1"
libc = "0.2"
# Steam HTTPS: pure-Rust TLS (graviola provider, no ring/aws-lc); system roots via the platform verifier.
ureq = { version = "=3.4.2", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls-graviola = "=0.4.0"
tokio = { version = "1", features = ["rt", "net", "macros", "fs", "signal", "process", "io-util"] }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
