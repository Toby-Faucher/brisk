[package]
name = "brisk-bridge"
edition.workspace = true
version.workspace = true
publish = false

[dependencies]
aes.workspace = true
aes-gcm.workspace = true
brisk-client.workspace = true
brisk-proto.workspace = true
bytes.workspace = true
hkdf = "0.13.0"
hmac = "0.12.1"
http = "1"
# No rustls/ring feature: quinn's own rustls glue needs ring or aws-lc (C/asm); src/quic_crypto.rs
# is the pure-Rust replacement.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
quinn-proto = { version = "0.11", default-features = false }
rand_core.workspace = true
rustls.workspace = true
rustls-rustcrypto.workspace = true
sha2.workspace = true
subtle.workspace = true
tokio = { workspace = true, features = ["rt", "net", "io-util", "time", "macros", "signal", "sync"] }
tracing.workspace = true
web-transport-proto = "0.6"

[dev-dependencies]
proptest.workspace = true
# Paused clock for the held-key watchdog tests.
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
url = "2"

[lints]
workspace = true
