# cargo-fuzz targets for the parsers that read attacker-influenced bytes (docs/ui-notes.md,
# "Fuzzing and property tests"; inventory in docs/fuzz-inventory.md).
#
# PURITY EXCEPTION: libfuzzer-sys compiles libFuzzer (C++) with `cc` and needs nightly. That is why
# this crate is its own workspace (the empty [workspace] table below) and NOT a member of the root
# workspace: the product build, scripts/brisk-service.sh update, scripts/check-pure-rust.sh and
# `cargo deny check` (all of which look at the root workspace graph) never see it.
# Run: cd fuzz && cargo +nightly fuzz run <target> -- -max_total_time=300
[package]
name = "brisk-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
brisk-proto = { path = "../crates/brisk-proto" }
brisk-bridge = { path = "../crates/brisk-bridge" }
brisk-client = { path = "../crates/brisk-client" }

[workspace]

[profile.release]
debug = 1

[[bin]]
name = "rtsp"
path = "fuzz_targets/rtsp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rtp_fec"
path = "fuzz_targets/rtp_fec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "control_enet"
path = "fuzz_targets/control_enet.rs"
test = false
doc = false
bench = false

[[bin]]
name = "input"
path = "fuzz_targets/input.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http_sdp"
path = "fuzz_targets/http_sdp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tap"
path = "fuzz_targets/tap.rs"
test = false
doc = false
bench = false

[[bin]]
name = "audio"
path = "fuzz_targets/audio.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bridge_input"
path = "fuzz_targets/bridge_input.rs"
test = false
doc = false
bench = false
