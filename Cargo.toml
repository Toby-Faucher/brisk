[workspace]
resolver = "2"
members = ["crates/brisk-proto", "crates/brisk-client", "crates/brisk-bridge", "crates/brisk-hostd"]

[workspace.package]
edition = "2024"
version = "0.0.0"

# RSA-2048 keygen is very slow unoptimised; tests generate identities.
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3

# Conservative on purpose: println!/eprintln! are deliberate in bridge/hostd, so no print lints.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
