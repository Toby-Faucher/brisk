<title>Brisk Mockups Round 2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Dark-only. Round 2: three options for the Stream screen (nothing on screen by default) and three for the Library. */
:root {
  --bg:#0b0c0f; --panel:#121419; --panel2:#171a21; --line:#22262f; --fg:#eceef3; --muted:#8e96a5;
  --accent:#5eead4; --accent-fg:#04201b; --ok:#4ade80; --warn:#fbbf24; --bad:#fb7185;
  --c-lib:#fbbf24; --c-stream:#60a5fa; --c-host:#38bdf8; --c-set:#94a3b8; --c-agent:#a78bfa; --c-news:#fb7185; --c-power:#4ade80;
  --font:'Geist',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
* { box-sizing:border-box; }
body { margin:0; background:#07080a; color:var(--fg); font-family:var(--font); font-size:14px; line-height:1.45; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); padding-block:0 48px; }
body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:50; background:#07080a; }
.page { max-width:1180px; margin:0 auto; }
.ctrl { position:sticky; top:env(safe-area-inset-top,0px); z-index:40; background:#07080a; padding:12px 0; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.ctrl h1 { font-size:15px; margin:0 6px 0 0; font-weight:600; }
.seg { display:flex; gap:4px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:3px; }
.seg button { border:0; background:transparent; color:var(--muted); font:inherit; font-weight:500; padding:6px 13px; border-radius:9px; cursor:pointer; transition:all .2s var(--ease); white-space:nowrap; }
.seg button[aria-selected="true"] { background:var(--panel2); color:var(--fg); box-shadow:0 0 0 1px var(--line); }
.sw { display:flex; gap:7px; align-items:center; margin-left:auto; }
.sw span { color:var(--muted); font-size:12.5px; }
.sw button { width:22px; height:22px; border-radius:50%; border:2px solid transparent; cursor:pointer; padding:0; transition:transform .2s var(--ease); }
.sw button:hover { transform:scale(1.15); } .sw button[aria-pressed="true"] { border-color:#fff; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.note { color:var(--muted); font-size:13px; margin:12px 0; max-width:90ch; }
.scroll { overflow-x:auto; }
.win { min-width:1000px; aspect-ratio:16/10; border:1px solid var(--line); border-radius:18px; overflow:hidden; background:var(--bg); position:relative; display:flex; }
.demo { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; align-items:center; }
.demo .lab { color:var(--muted); font-size:12.5px; margin-right:4px; }
.btn { border:0; font:inherit; font-weight:600; cursor:pointer; border-radius:11px; padding:7px 14px; background:var(--accent); color:var(--accent-fg); transition:transform .18s var(--ease), filter .18s; display:inline-flex; gap:8px; align-items:center; }
.btn:hover { filter:brightness(1.08); transform:translateY(-1px); } .btn:active { transform:scale(.97); }
.btn.ghost { background:var(--panel2); color:var(--fg); box-shadow:0 0 0 1px var(--line) inset; }
.btn.danger { background:color-mix(in srgb,var(--bad) 22%,transparent); color:var(--bad); }
.btn.sm { padding:5px 11px; font-size:12.5px; border-radius:9px; }
.mono { font-family:var(--mono); font-variant-numeric:tabular-nums; }
.dot { width:8px; height:8px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent); display:inline-block; animation:pulse 2.4s ease-in-out infinite; flex:0 0 auto; }
@keyframes pulse { 50% { box-shadow:0 0 0 6px transparent; } }
svg.i { width:18px; height:18px; flex:0 0 auto; }
[hidden] { display:none !important; }

/* ---------- the pretend game frame (stands in for the video) ---------- */
.game { position:absolute; inset:0; background:
  radial-gradient(60% 50% at 24% 30%, #3b2a57 0%, transparent 70%), radial-gradient(50% 45% at 80% 70%, #5a2742 0%, transparent 70%),
  linear-gradient(160deg,#14182a,#241a33 55%,#2d1b30); overflow:hidden; }
.game .card { position:absolute; width:150px; height:210px; border-radius:16px; background:linear-gradient(160deg,#f5e6c8,#d8b98a); box-shadow:0 18px 40px rgba(0,0,0,.45); transform:rotate(var(--r)); }
.game .card::after { content:""; position:absolute; inset:14px; border-radius:10px; border:2px solid rgba(60,30,20,.35); }
.game .tag { position:absolute; left:14px; top:12px; font-size:11px; color:rgba(255,255,255,.55); font-family:var(--mono); background:rgba(0,0,0,.35); padding:2px 8px; border-radius:8px; }
.game .cursor { position:absolute; width:22px; height:22px; border-radius:50% 50% 50% 0; background:#fff; transform:rotate(-45deg); left:56%; top:46%; box-shadow:0 4px 14px rgba(0,0,0,.5); }

/* shared glass panel */
.glass { background:color-mix(in srgb,#12151b 78%,transparent); backdrop-filter:blur(18px) saturate(1.3); border:1px solid color-mix(in srgb,#fff 10%,transparent); box-shadow:0 18px 50px rgba(0,0,0,.45); border-radius:20px; }
.ic { width:34px; height:34px; border-radius:11px; display:grid; place-items:center; border:0; background:transparent; cursor:pointer; position:relative; transition:background .18s, transform .2s var(--ease); color:var(--fg); }
.ic:hover { background:color-mix(in srgb,#fff 10%,transparent); transform:translateY(-1px); }
.ic[aria-pressed="true"] { background:color-mix(in srgb,var(--accent) 22%,transparent); }
.ic .tip { position:absolute; top:calc(100% + 8px); left:50%; transform:translateX(-50%) translateY(-4px); background:#000c; color:#fff; font-size:11.5px; padding:3px 8px; border-radius:7px; white-space:nowrap; opacity:0; pointer-events:none; transition:all .18s var(--ease); }
.ic:hover .tip { opacity:1; transform:translateX(-50%); }
.ic, .rowB .mono, .rowB b { white-space:nowrap; }
.sep { width:1px; height:20px; background:color-mix(in srgb,#fff 14%,transparent); margin:0 4px; }
.chip { display:inline-flex; gap:7px; align-items:center; padding:5px 11px; border-radius:999px; background:color-mix(in srgb,#fff 8%,transparent); font-size:12.5px; border:0; color:var(--fg); font-family:inherit; cursor:pointer; transition:background .18s; }
.chip:hover { background:color-mix(in srgb,#fff 14%,transparent); }
.chip[aria-pressed="true"] { background:color-mix(in srgb,var(--accent) 24%,transparent); box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 60%,transparent) inset; }
input[type=range] { accent-color:var(--accent); height:4px; }
.vol { width:90px; }

/* stats panel */
.stats { padding:14px; width:300px; display:grid; gap:10px; }
.stats h5 { margin:0; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600; display:flex; justify-content:space-between; }
.gr { display:grid; grid-template-columns:1fr auto; gap:2px 10px; align-items:end; }
.gr .n { font-family:var(--mono); font-size:19px; font-weight:500; text-align:right; } .gr .n small { font-size:11px; color:var(--muted); margin-left:2px; }
.gr .l { font-size:12px; color:var(--muted); }
.gr canvas { grid-column:1 / 3; width:100%; height:38px; }

/* toasts */
.toast { position:absolute; left:50%; bottom:22px; transform:translateX(-50%) translateY(14px); padding:9px 16px; border-radius:14px; display:flex; gap:10px; align-items:center; font-weight:500; opacity:0; pointer-events:none; transition:all .35s var(--ease); z-index:20; }
.toast.on { opacity:1; transform:translateX(-50%); }
.spin { width:14px; height:14px; border-radius:50%; border:2px solid color-mix(in srgb,#fff 25%,transparent); border-top-color:var(--accent); animation:sp .8s linear infinite; }
@keyframes sp { to { transform:rotate(360deg); } }
.esc { position:absolute; left:50%; bottom:70px; transform:translateX(-50%) scale(.9); padding:12px 18px; border-radius:18px; display:flex; gap:12px; align-items:center; opacity:0; pointer-events:none; transition:all .3s var(--ease); z-index:20; }
.esc.on { opacity:1; transform:translateX(-50%); }
.ring { width:34px; height:34px; border-radius:50%; background:conic-gradient(var(--accent) calc(var(--p,0)*1%), color-mix(in srgb,#fff 14%,transparent) 0); display:grid; place-items:center; }
.ring b { width:26px; height:26px; border-radius:50%; background:#12151b; display:grid; place-items:center; font-size:10.5px; font-family:var(--mono); }
kbd { font-family:var(--mono); font-size:11px; padding:1px 6px; border-radius:6px; border:1px solid color-mix(in srgb,#fff 22%,transparent); color:#dfe3ea; }

/* option A: top pill */
.barA { position:absolute; top:14px; left:50%; transform:translateX(-50%) translateY(-90px); padding:6px 8px; display:flex; align-items:center; gap:2px; transition:transform .45s var(--ease); z-index:15; border-radius:999px; }
.barA.on { transform:translateX(-50%) translateY(0); }
.hotA { position:absolute; inset:0 0 auto 0; height:56px; z-index:14; }
.statsA { position:absolute; left:16px; top:76px; opacity:0; transform:translateY(-8px) scale(.98); pointer-events:none; transition:all .35s var(--ease); z-index:12; }
.statsA.on { opacity:1; transform:none; pointer-events:auto; }
.peekA { position:absolute; top:6px; left:50%; width:44px; height:4px; border-radius:4px; background:color-mix(in srgb,#fff 28%,transparent); transform:translateX(-50%); transition:opacity .3s; }
/* option B: right dock */
.dockB { position:absolute; top:50%; right:12px; transform:translateY(-50%) translateX(calc(100% + 16px)); width:268px; padding:14px; display:grid; gap:13px; transition:transform .5s var(--ease); z-index:15; }
.dockB.on { transform:translateY(-50%); }
.hotB { position:absolute; top:0; bottom:0; right:0; width:46px; z-index:14; }
.handleB { position:absolute; right:6px; top:50%; width:5px; height:64px; border-radius:5px; background:color-mix(in srgb,#fff 26%,transparent); transform:translateY(-50%); transition:opacity .3s; z-index:13; }
.dockB h6 { margin:0 0 6px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600; }
.rowB { display:flex; align-items:center; gap:10px; } .rowB .grow { flex:1; }
.sw2 { width:34px; height:20px; border-radius:20px; background:color-mix(in srgb,#fff 16%,transparent); position:relative; cursor:pointer; border:0; padding:0; transition:background .2s; }
.sw2::after { content:""; position:absolute; top:3px; left:3px; width:14px; height:14px; border-radius:50%; background:#fff; transition:transform .25s var(--ease); }
.sw2[aria-pressed="true"] { background:var(--accent); } .sw2[aria-pressed="true"]::after { transform:translateX(14px); background:var(--accent-fg); }
/* option C: command overlay */
.cmdC { position:absolute; left:50%; top:16%; transform:translateX(-50%) translateY(-14px) scale(.97); width:560px; padding:10px; opacity:0; pointer-events:none; transition:all .35s var(--ease); z-index:25; }
.cmdC.on { opacity:1; transform:translateX(-50%); pointer-events:auto; }
.cmdC input { width:100%; background:transparent; border:0; outline:0; color:var(--fg); font:inherit; font-size:16px; padding:12px 14px; }
.cmdC .list { padding:4px; display:grid; gap:2px; }
.cmdC .it { display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:12px; cursor:pointer; }
.cmdC .it:hover, .cmdC .it.sel { background:color-mix(in srgb,#fff 9%,transparent); }
.cmdC .it .k { margin-left:auto; }
.whisper { position:absolute; right:16px; bottom:14px; font-size:12px; color:color-mix(in srgb,#fff 52%,transparent); display:flex; gap:6px; align-items:center; transition:opacity .6s; z-index:5; }
.dim { position:absolute; inset:0; background:rgba(0,0,0,.35); opacity:0; pointer-events:none; transition:opacity .3s; z-index:22; } .dim.on { opacity:1; pointer-events:auto; }
.strip { position:absolute; left:50%; bottom:16px; transform:translateX(-50%) translateY(120%); padding:10px 16px; display:flex; gap:22px; transition:transform .5s var(--ease); z-index:12; }
.strip.on { transform:translateX(-50%); }

/* ---------- library window ---------- */
.side { width:210px; background:var(--panel); border-right:1px solid var(--line); padding:14px 10px; display:flex; flex-direction:column; gap:2px; flex:0 0 auto; }
.brand { display:flex; align-items:center; gap:9px; padding:4px 8px 14px; font-weight:700; }
.brand i { width:22px; height:22px; border-radius:8px; background:var(--accent); display:grid; place-items:center; color:var(--accent-fg); }
.nav { display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:10px; color:var(--muted); border:0; background:transparent; font:inherit; text-align:left; width:100%; cursor:pointer; transition:background .18s, color .18s, transform .18s var(--ease); }
.nav:hover { background:var(--panel2); color:var(--fg); transform:translateX(2px); }
.nav[aria-current="page"] { background:var(--panel2); color:var(--fg); box-shadow:0 0 0 1px var(--line) inset; }
.libmain { flex:1; min-width:0; display:flex; flex-direction:column; }
.top { display:flex; align-items:center; gap:12px; padding:14px 22px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.top h2 { margin:0; font-size:18px; letter-spacing:-.02em; }
.hostpill { margin-left:auto; display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:5px 6px 5px 12px; }
.search { display:flex; align-items:center; gap:8px; padding:6px 12px; border-radius:11px; background:var(--panel); border:1px solid var(--line); color:var(--muted); min-width:210px; }
.search input { background:transparent; border:0; outline:0; color:var(--fg); font:inherit; width:100%; }
.filters { display:flex; gap:6px; padding:12px 22px 0; flex-wrap:wrap; }
.fchip { padding:5px 12px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--muted); cursor:pointer; font:inherit; font-size:13px; transition:all .2s var(--ease); }
.fchip:hover { color:var(--fg); border-color:#3a4152; }
.fchip[aria-pressed="true"] { background:color-mix(in srgb,var(--accent) 20%,transparent); border-color:var(--accent); color:var(--fg); }
.body { flex:1; overflow:auto; padding:16px 22px 22px; position:relative; }
.cover { border-radius:16px; position:relative; overflow:hidden; display:grid; place-items:center; color:#fff; }
.cover b { font-size:44px; font-weight:700; letter-spacing:-.04em; opacity:.92; text-shadow:0 6px 24px rgba(0,0,0,.35); }
.cover::before { content:""; position:absolute; inset:0; background:radial-gradient(90% 70% at 20% 10%, rgba(255,255,255,.28), transparent 60%); }
.cover .shape { position:absolute; border-radius:50%; background:rgba(255,255,255,.16); }
.badge { position:absolute; left:10px; top:10px; z-index:2; font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px; background:#0009; backdrop-filter:blur(6px); display:flex; gap:6px; align-items:center; }
.badge i { width:7px; height:7px; border-radius:50%; background:var(--ok); } .badge.off i { background:var(--muted); }
.glow { position:absolute; inset:0; opacity:0; transition:opacity .4s; background:radial-gradient(80% 60% at 50% 100%, color-mix(in srgb,var(--accent) 45%,transparent), transparent 70%); pointer-events:none; z-index:1; }
.play { position:absolute; left:50%; bottom:14px; transform:translateX(-50%) translateY(12px); opacity:0; transition:all .35s var(--ease); z-index:3; }
/* grid */
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:16px; }
.g { cursor:pointer; transition:transform .3s var(--ease); }
.g .cover { aspect-ratio:2/3; }
.g:hover { transform:translateY(-5px) scale(1.02); }
.g:hover .glow, .g:hover .play { opacity:1; } .g:hover .play { transform:translateX(-50%); }
.g .name { margin-top:8px; font-weight:500; } .g .sub { color:var(--muted); font-size:12.5px; }
.g.off .cover { filter:saturate(.35) brightness(.7); }
.g.off:hover .cover { filter:saturate(.8) brightness(.9); }
/* shelves */
.hero { border-radius:24px; padding:22px; display:flex; gap:22px; align-items:center; min-height:200px; position:relative; overflow:hidden; border:1px solid var(--line); }
.hero h3 { margin:2px 0 6px; font-size:28px; letter-spacing:-.03em; }
.shelf { margin-top:20px; } .shelf h4 { margin:0 0 10px; font-size:13px; font-weight:600; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; display:flex; justify-content:space-between; }
.row { display:flex; gap:14px; overflow-x:auto; padding-bottom:6px; scrollbar-width:thin; }
.row .g { flex:0 0 138px; }
/* list + detail */
.ld { display:grid; grid-template-columns:minmax(280px,1fr) 1.15fr; gap:18px; height:100%; }
.rows { display:grid; align-content:start; gap:2px; overflow:auto; }
.lrow { display:grid; grid-template-columns:36px 1fr auto; gap:12px; align-items:center; padding:8px 10px; border-radius:12px; cursor:pointer; transition:background .18s; }
.lrow:hover { background:var(--panel); } .lrow[aria-selected="true"] { background:var(--panel2); box-shadow:0 0 0 1px var(--line) inset; }
.lrow .cover { width:36px; height:36px; border-radius:10px; } .lrow .cover b { font-size:15px; }
.lrow .t { font-weight:500; } .lrow .s { color:var(--muted); font-size:12.5px; }
.detail { background:var(--panel); border:1px solid var(--line); border-radius:22px; overflow:hidden; display:flex; flex-direction:column; }
.detail .art { height:200px; position:relative; display:grid; place-items:center; }
.detail .art b { font-size:72px; letter-spacing:-.05em; opacity:.9; }
.detail .info { padding:18px 20px; display:grid; gap:12px; }
.detail h3 { margin:0; font-size:24px; letter-spacing:-.03em; }
.kv { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; } .kv div { background:var(--panel2); border-radius:13px; padding:9px 12px; } .kv span { display:block; color:var(--muted); font-size:11.5px; } .kv b { font-weight:600; }
.pbar { height:6px; border-radius:6px; background:var(--panel2); overflow:hidden; } .pbar i { display:block; height:100%; background:var(--accent); width:0; transition:width 1.2s var(--ease); }
.lt { position:absolute; left:50%; bottom:18px; transform:translateX(-50%) translateY(14px); opacity:0; padding:10px 16px; border-radius:14px; display:flex; gap:10px; align-items:center; font-weight:500; transition:all .35s var(--ease); z-index:20; pointer-events:none; }
.lt.on { opacity:1; transform:translateX(-50%); }
@media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>

<div class="page">
  <div class="ctrl">
    <h1>Brisk, round 2</h1>
    <div class="seg" id="screen"><button data-s="stream" aria-selected="true">Stream screen</button><button data-s="lib" aria-selected="false">Library</button></div>
    <div class="seg" id="opt"></div>
    <div class="sw" id="sw"><span>Accent</span></div>
  </div>
  <p class="note" id="note"></p>
  <div class="demo" id="demo"></div>
  <div class="scroll"><div class="win" id="win"></div></div>
  <p class="note">Mockups with sample data. The "game" is a stand-in for the video, and none of this talks to bawn. On the real stream screen no shader runs, so video latency stays exactly as measured.</p>
</div>

function libFrame(inner, title = 'Library') {
  return `<aside class="side"><div class="brand"><i>${ic('bolt', 'currentColor', 14)}</i> Brisk</div>
   <button class="nav">${ic('home', 'var(--accent)')}Home</button><button class="nav" aria-current="page">${ic('lib', 'var(--c-lib)')}Library</button><button class="nav">${ic('stream', 'var(--c-stream)')}Stream</button><button class="nav">${ic('host', 'var(--c-host)')}Machines</button><button class="nav">${ic('set', 'var(--c-set)')}Settings</button></aside>
   <div class="libmain"><div class="top"><h2>${title}</h2><div class="search">${ic('search', 'var(--muted)', 16)}<input id="lq" placeholder="Search games" value="${st.q}" aria-label="Search games"></div>
   <div class="hostpill"><span class="dot"></span><b>bawn</b><span class="mono" style="color:var(--muted)">Online · Sunshine ready</span><button class="btn ghost sm" id="wake" title="Wake-on-LAN">${ic('power', 'var(--c-power)', 15)} Wake</button></div></div>
   <div class="filters" id="fl">${['All', 'Installed', 'Not installed', 'Recent'].map((f) => `<button class="fchip" aria-pressed="${st.filter === f}" data-f="${f}">${f}</button>`).join('')}</div>
   <div class="body" id="body">${inner}</div></div><div class="lt glass" id="lt"></div>`;
}
function visible() {
  return GAMES.filter((g) => (st.filter === 'All' || (st.filter === 'Installed' && g.inst) || (st.filter === 'Not installed' && !g.inst) || (st.filter === 'Recent' && g.last && /Today|Yesterday|days/.test(g.last))) && g.name.toLowerCase().includes(st.q.toLowerCase()));
}
function launch(g) {
  const lt = $('#lt'); lt.innerHTML = g.inst ? `<span class="spin"></span> Launching <b>${g.name}</b> on bawn, then streaming…` : `${ic('dl', 'var(--c-host)')} <b>${g.name}</b> is not installed. Install ${g.size} on bawn first?`;
  lt.classList.add('on'); clearTimeout(launch.t); launch.t = setTimeout(() => lt.classList.remove('on'), 2800);
}
const gridCard = (g, i) => `<div class="g ${g.inst ? '' : 'off'}" data-i="${GAMES.indexOf(g)}" tabindex="0" role="button" aria-label="${g.name}">${(() => { const c = cover(g); return c.replace('</div>', `<span class="badge ${g.inst ? '' : 'off'}"><i></i>${g.inst ? 'Installed' : g.size}</span><span class="glow"></span><button class="btn sm play">${ic(g.inst ? 'play' : 'dl', 'currentColor', 13)} ${g.inst ? 'Play' : 'Install'}</button></div>`); })()}<div class="name">${g.name}</div><div class="sub">${g.inst ? 'Played ' + g.last.toLowerCase() : 'Not installed'}</div></div>`;
function libA(w) { const v = visible(); w.innerHTML = libFrame(`<div class="grid">${v.map(gridCard).join('') || '<p class="muted" style="color:var(--muted)">Nothing here yet. Try another filter.</p>'}</div>`); wireLib(w); }
function libB(w) {
  const last = GAMES[0], inst = visible().filter((g) => g.inst), off = visible().filter((g) => !g.inst);
  w.innerHTML = libFrame(`<div class="hero" style="background:radial-gradient(120% 140% at 85% 0%, ${last.g[0]}aa, #12151c 62%)">${cover(last, '', 'width:150px;flex:0 0 auto;aspect-ratio:2/3')}
   <div style="min-width:0"><div class="muted" style="color:#c9d1e0">Continue where you left off</div><h3>${last.name}</h3><div class="muted" style="color:#c9d1e0">Played today · ${last.hrs} total</div>
   <div style="display:flex;gap:10px;margin-top:16px"><button class="btn" data-launch="0">${ic('play', 'currentColor', 14)} Resume</button><button class="btn ghost">Details</button></div></div></div>
   ${inst.length ? `<div class="shelf"><h4><span>Installed</span><span>${inst.length}</span></h4><div class="row">${inst.map(gridCard).join('')}</div></div>` : ''}
   ${off.length ? `<div class="shelf"><h4><span>Not installed</span><span>${off.length}</span></h4><div class="row">${off.map(gridCard).join('')}</div></div>` : ''}`);
  wireLib(w);
}
function libC(w) {
  const v = visible(); if (st.sel >= v.length) st.sel = 0; const g = v[st.sel] || GAMES[0];
  w.innerHTML = libFrame(`<div class="ld"><div class="rows" id="rows">${v.map((x) => `<div class="lrow" data-i="${GAMES.indexOf(x)}" aria-selected="${x === g}">${cover(x)}<div><div class="t">${x.name}</div><div class="s">${x.inst ? 'Played ' + x.last.toLowerCase() : 'Not installed'}</div></div><span class="mono" style="color:var(--muted)">${x.inst ? x.hrs : x.size}</span></div>`).join('')}</div>
   <div class="detail"><div class="art" style="background:linear-gradient(145deg,${g.g[0]},${g.g[1]})"><b>${g.ini}</b></div>
   <div class="info"><h3>${g.name}</h3><div class="kv"><div><span>Status</span><b>${g.inst ? 'Installed' : 'Not installed'}</b></div><div><span>Size</span><b>${g.size}</b></div><div><span>Played</span><b>${g.inst ? g.hrs : '–'}</b></div></div>
   <div><div class="muted" style="color:var(--muted);font-size:12px;margin-bottom:6px">Stream quality for this game</div><div style="display:flex;gap:6px">${['Fast', 'Balanced', 'Crisp'].map((p) => `<button class="chip" aria-pressed="${p === 'Balanced'}">${p}</button>`).join('')}</div></div>
   <div style="display:flex;gap:10px;align-items:center">${g.inst ? `<button class="btn" data-launch="${GAMES.indexOf(g)}">${ic('play', 'currentColor', 14)} Launch and stream</button>` : `<button class="btn" data-install="${GAMES.indexOf(g)}">${ic('dl', 'currentColor', 14)} Install on bawn</button>`}<button class="btn ghost">Properties</button></div>
   <div class="pbar" id="pb"><i></i></div></div></div></div>`);
  $$('.lrow', w).forEach((r) => (r.onclick = () => { st.sel = v.indexOf(GAMES[+r.dataset.i]); libC(w); }));
  wireLib(w);
}
function wireLib(w) {
  $('#lq').oninput = (e) => { st.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $('#lq'); q.focus(); q.setSelectionRange(pos, pos); };
  $$('#fl .fchip').forEach((b) => (b.onclick = () => { st.filter = b.dataset.f; render(); }));
  $$('.g', w).forEach((el) => (el.onclick = () => launch(GAMES[+el.dataset.i])));
  $$('[data-launch]', w).forEach((b) => (b.onclick = () => launch(GAMES[+b.dataset.launch])));
  $$('[data-install]', w).forEach((b) => (b.onclick = () => { const pb = $('#pb i'); pb.style.width = '100%'; launch(GAMES[+b.dataset.install]); }));
  $('#wake').onclick = () => { const lt = $('#lt'); lt.innerHTML = `${ic('power', 'var(--c-power)')} bawn is already on. Wake would send a magic packet when it is off.`; lt.classList.add('on'); setTimeout(() => lt.classList.remove('on'), 2600); };
}
function demoLib() { $('#demo').innerHTML = `<span class="lab">Try it: filter, search, hover a cover, click a game to launch or install, press Wake.</span>`; }

/* ----- render ----- */
function render() {
  const w = $('#win'); drawHeader(); document.onkeydown = null; w.__show = null; w.__refresh = null;
  w.style.background = st.screen === 'stream' ? '#000' : 'var(--bg)'; w.style.display = st.screen === 'stream' ? 'block' : 'flex';
  if (st.screen === 'stream') { [streamA, streamB, streamC][st.opt - 1](w); demoStream(); drawStats(); }
  else { [libA, libB, libC][st.opt - 1](w); demoLib(); }
}
render();
</script>
