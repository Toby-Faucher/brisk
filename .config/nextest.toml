# cargo nextest run --workspace            (default profile)
# cargo nextest run --workspace --profile ci
# Doc-tests are not run by nextest: also run `cargo test --doc --workspace`.
[profile.default]
retries = 0
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.ci]
fail-fast = false
retries = 0
slow-timeout = { period = "30s", terminate-after = 4 }
