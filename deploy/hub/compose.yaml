# Brisk machine hub for Dockge. Replace the <placeholders>; docs/hosting-runbook.md, Machine hub.
# Host networking: hostd binds 127.0.0.1:8443 only and trusts a tailnet login only from a loopback
# peer, so `tailscale serve` on this VM (https 443 -> http://127.0.0.1:8443) is the way in.
services:
  brisk-hub:
    image: brisk-hub:local
    network_mode: host
    restart: unless-stopped
    environment:
      BRISK_MACHINES_FILE: /config/machines.json
      BRISK_SECRET_FILE: /data/secret            # the hub's own secret (created on first start)
      BRISK_STATIC: embed
      BRISK_DATA_DIR: /data
      # tailscale serve on 443 sends Host without a port; direct :8443 access sends it with one.
      BRISK_ALLOWED_HOSTS: "<hub>.<tailnet>.ts.net,<hub>.<tailnet>.ts.net:8443"
      # Optional: tailnet logins let in without the secret (see the runbook before using).
      # BRISK_ALLOWED_USERS: "<you>@example.invalid"
    volumes:
      - /srv/brisk-hub/config:/config:ro         # machines.json + secret and CA files, readable by uid 10001
      - data:/data                               # prefs, notes, the hub secret
    # TCP check only: the page needs no login, but the image has no curl. bash is in debian-slim.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8443"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
volumes:
  data:
