# cargo deny check          (advisories, licenses, bans, sources; needs network for the RustSec db)
# cargo deny check bans licenses sources    (offline-safe subset)
# Config schema: cargo-deny 0.20.

[graph]
# The product's native targets only. quinn-proto 0.11 pulls `ring` for wasm32-unknown-unknown
# (browser builds Brisk never makes), so scanning "all" targets would flag a crate we do not build.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# Only crates that are workspace dependencies are checked for "unmaintained".
unmaintained = "workspace"
yanked = "deny"
# Seven advisories are accepted on purpose; each reason says whether it is reachable.
# paste (RUSTSEC-2024-0436, unmaintained) needs no entry: unmaintained = "workspace" skips transitive deps.
# Dev-only crates are checked too (no exclude-dev in [graph]); none needs an entry here.
ignore = [
    # rustls-webpki 0.102.8 comes only from rustls-rustcrypto 0.0.2-alpha, which imports just the
    # `alg_id` constants from it (verify/{ecdsa,eddsa,rsa}.rs). No chain, CRL or name-constraint code
    # of 0.102.8 runs: the bridge uses with_no_client_auth (quic_crypto.rs) and the client's pinned
    # verifier only checks signatures (brisk-client/src/session.rs). Not reachable.
    # TODO: remove all five when rustls-rustcrypto leaves the lock.
    { id = "RUSTSEC-2026-0049", reason = "rustls-webpki 0.102.8: only alg_id constants are used, no verifier code runs; TODO remove with rustls-rustcrypto" },
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.102.8: only alg_id constants are used, no verifier code runs; TODO remove with rustls-rustcrypto" },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki 0.102.8: only alg_id constants are used, no verifier code runs; TODO remove with rustls-rustcrypto" },
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki 0.102.8: only alg_id constants are used, no verifier code runs; TODO remove with rustls-rustcrypto" },
    { id = "RUSTSEC-2026-0382", reason = "rustls-webpki 0.102.8: only alg_id constants are used, no verifier code runs; TODO remove with rustls-rustcrypto" },
    # rsa 0.9.10 (Marvin timing, no fixed release) is a DIRECT dependency of brisk-proto and
    # brisk-client. RSA private-key operations happen only in the client (pairing signatures, TLS
    # client auth to Sunshine at 127.0.0.1), so measuring them needs a local attacker or a malicious host.
    # TODO: keep until a fixed rsa (0.10 stable) or a replacement exists.
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin timing: private-key ops only in the client (pairing, Sunshine mTLS on loopback); needs a local attacker or malicious host; no fix exists; TODO until fix or replacement" },
    # crypto-bigint 0.5.5 comes via elliptic-curve/p256/p384 from rustls-rustcrypto (not via rsa).
    # REACHABLE: the bridge signs with its P-256 ECDSA key (quic_crypto.rs with_single_cert, with_no_client_auth)
    # in every TLS handshake, and any tailnet peer can start handshakes before the token check.
    # Accepted: remote timing exploitation is impractical.
    { id = "RUSTSEC-2026-0387", reason = "REACHABLE: P-256 signing per bridge handshake by any tailnet peer; accepted risk, remote timing impractical; TODO replace rustls-rustcrypto (graviola has no QUIC yet)" },
]

[licenses]
confidence-threshold = 0.93
# Workspace crates are publish = false and carry no license field.
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]

[bans]
multiple-versions = "deny"
# Each duplicate below is pulled in by a dependency we do not control. Skip the version with fewer
# users; drop the entry once the lock has one version (cargo deny then warns the skip is unused).
skip = [
    { crate = "base64@0.22.1", reason = "sfv (web-transport-proto, bridge) is on 0.22; ureq is on 0.23" },
    { crate = "chacha20@0.9.1", reason = "chacha20poly1305 0.10 from rustls-rustcrypto; rand 0.10 (proptest, quinn-proto) uses 0.10" },
    { crate = "cpufeatures@0.3.1", reason = "only chacha20 0.10 (rand 0.10) uses it; the RustCrypto 0.10 crates use 0.2" },
    { crate = "getrandom@0.2.17", reason = "rand_core 0.6 (RustCrypto stack and our OsRng) uses 0.2; rand 0.10 and tempfile use 0.4" },
    { crate = "getrandom@0.3.4", reason = "graviola (rustls-graviola, hostd Steam HTTPS) uses 0.3" },
    { crate = "rand@0.8.8", reason = "num-bigint-dig (rsa) uses rand 0.8; proptest and quinn-proto use 0.10" },
    { crate = "rand_core@0.6.4", reason = "the RustCrypto 0.10 stack (rsa, signature, elliptic-curve) uses 0.6; rand 0.10 uses 0.10" },
    { crate = "rustls-webpki@0.102.8", reason = "rustls-rustcrypto 0.0.2-alpha pins 0.102; rustls uses 0.103 (see the advisory ignores above)" },
    { crate = "syn@3.0.9", reason = "some proc macros (displaydoc, ref-cast-impl) moved to syn 3, the rest are on 2; build time only" },
]
wildcards = "deny"
# Path dependencies between our own crates carry no version wildcard issue.
allow-wildcard-paths = true
deny = [
    # Typosquat used in the Aug 2026 crates.io campaign (arrayref 0.3.10, internment 0.8.7,
    # append-only-vec 0.1.9 depended on it; its build.rs downloaded a payload).
    { crate = "proc-macro1", reason = "typosquat from the 2026-08 crates.io malware campaign" },
    # C / asm crypto and TLS: Brisk is pure Rust (scripts/check-pure-rust.sh).
    { crate = "openssl-sys", reason = "C TLS library; Brisk is pure Rust" },
    { crate = "aws-lc-sys", reason = "C crypto library; Brisk is pure Rust" },
    { crate = "ring", reason = "C + asm crypto; only on the wasm32 edge that graph.targets excludes" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
